name: Update item stats from eqlwiki

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerer items.json depuis eqlwiki
        run: python tools/update_items.py

      # items-all.json sortait deja de l'etape precedente mais n'etait jamais commite :
      # la base complete des deux calculateurs restait figee. On la decoupe et on la garde.
      - name: Refabriquer items-calc.json depuis items-all.json
        run: python tools/build_items_calc.py

      - name: Verifier que items.json est valide
        run: |
          python - <<'PY'
          import json
          d=json.load(open("items.json",encoding="utf-8"))
          n=len(d.get("items",{}))
          assert n>=50, "trop peu d'objets : %d" % n
          assert d.get("updated"), "date manquante"
          print("controle ok :", n, "objets, maj", d["updated"])
          PY

      # Le message de commit doit dire CE QUI a change : sinon l'historique GitHub est
      # une suite de lignes identiques et personne ne voit arriver les objets d'un patch.
      # Le message de commit doit dire CE QUI a change : sinon l'historique GitHub est
      # une suite de lignes identiques et personne ne voit arriver les objets d'un patch.
      #
      # PIEGE, paye le 26/08/2026 : ne rediriger vers $GITHUB_ENV que la ligne de variable.
      # Tout le reste part sur stderr. Une redirection globale de stdout fait lire les lignes
      # de detail comme des affectations et le job echoue sur « Invalid format ».
      - name: Resumer ce qui a change
        run: |
          python - <<'PY'
          import json, os, subprocess, sys

          def avant(chemin):
              try:
                  b = subprocess.run(["git", "show", "HEAD:" + chemin],
                                     capture_output=True, check=True).stdout
                  return json.loads(b).get("items", {})
              except Exception:
                  return {}

          def maintenant(chemin):
              try:
                  return json.load(open(chemin, encoding="utf-8")).get("items", {})
              except Exception:
                  return {}

          a, b = avant("items-all.json"), maintenant("items-all.json")
          neufs = sorted(set(b) - set(a))
          partis = sorted(set(a) - set(b))
          bouges = sorted(n for n in set(a) & set(b) if a[n] != b[n])

          bouts = []
          if neufs:
              bouts.append("%d nouveaux" % len(neufs))
          if bouges:
              bouts.append("%d modifies" % len(bouges))
          if partis:
              bouts.append("%d retires" % len(partis))
          resume = ", ".join(bouts) or "aucun objet touche"

          titre = "Auto: " + resume
          if neufs:
              titre += " - " + ", ".join(neufs[:3]) + ("..." if len(neufs) > 3 else "")
          # une seule ligne, sans saut, sans caractere qui casse le format cle=valeur
          titre = " ".join(titre.split())[:180]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("RESUME_ITEMS=" + titre + "\n")

          # le detail va dans le journal du job, jamais dans GITHUB_ENV
          print(titre, file=sys.stderr)
          for n in neufs[:40]:
              print("  nouveau :", n, file=sys.stderr)
          for n in bouges[:40]:
              print("  modifie :", n, file=sys.stderr)
          PY

      - name: Publier si quelque chose a change
        run: |
          FICHIERS="items.json items-all.json items-calc.json effects.json quests.json drops.json"
          SUIVIS=""
          for f in $FICHIERS; do [ -f "$f" ] && SUIVIS="$SUIVIS $f"; done
          if git diff --quiet -- $SUIVIS; then
            echo "aucun changement"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $SUIVIS
            git commit -m "${RESUME_ITEMS:-Auto: item stats refreshed from eqlwiki}"
            git push
          fi
