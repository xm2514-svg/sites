name: Update item stats from eqlwiki

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerer items.json depuis eqlwiki
        run: python tools/update_items.py

      - name: Verifier que items.json est valide
        run: |
          python - <<'PY'
          import json
          d=json.load(open("items.json",encoding="utf-8"))
          n=len(d.get("items",{}))
          assert n>=50, "trop peu d'objets : %d" % n
          assert d.get("updated"), "date manquante"
          print("controle ok :", n, "objets, maj", d["updated"])
          PY

      - name: Publier si quelque chose a change
        run: |
          if git diff --quiet -- items.json; then
            echo "aucun changement"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add items.json
            git commit -m "Auto: item stats refreshed from eqlwiki"
            git push
          fi
